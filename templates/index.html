<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Collection</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Login Page -->
  <div id="loginPage">
    <form id="loginForm">
      <h2>Login</h2>
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
      <p id="errorMsg"></p>
    </form>
  </div>
  <!-- Main Page -->
  <div id="mainContent">
    <div class="navbar">
      <form id="searchForm">
        <button type="button" onclick="window.location.href='/'">Home</button>

        <!-- UPLOADED BOOKS BUTTON -->
        <button type="button" onclick="window.location.href='/uploaded_books'">Uploaded Books</button>          

        <button type="button" onclick="window.location.href='/upload_page'">Upload</button>

        <input type="text" id="searchInput" placeholder="Search book...">
        <button type="submit">Search</button>
      </form>
      <button class="login-btn" onclick="logout()">Logout</button>
    </div>

    <h1>Book Exchange Platform</h1>

    <div id="bookGrid"></div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
