<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Book</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="navbar">
        <button onclick="window.location.href='/'">Home</button>
        <button onclick="window.location.href='/uploaded_books'">Uploaded Books</button>
        <button class="active">Upload</button>
    </div>

    <div class="upload-container">
        <h1>📖 Upload Your Book</h1>
        <form action="/upload" method="POST" enctype="multipart/form-data" class="upload-form">
            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number:</label>
                <input type="tel" id="mobile" name="mobile" required>
            </div>

            <div class="form-group">
                <label for="bookname">Book Name:</label>
                <input type="text" id="bookname" name="bookname" required>
            </div>

            <div class="form-group">
                <label for="author">Author:</label>
                <input type="text" id="author" name="author" required>
            </div>

            <div class="form-group">
                <label for="description">Description:</label>
                <textarea id="description" name="description" rows="4" required></textarea>
            </div>

            <div class="form-group">
                <label for="rentprice">Rent Price (₹):</label>
                <input type="number" id="rentprice" name="rentprice" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="buyprice">Buy Price (₹):</label>
                <input type="number" id="buyprice" name="buyprice" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="image">Book Cover Image:</label>
                <input type="file" id="image" name="image" accept="image/*" required>
            </div>

            <button type="submit" class="submit-btn">Upload Book</button>
        </form>
    </div>
</body>
</html>
